name: Feature request
description: Suggest an improvement or a new capability.
title: "[feat]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please check the roadmap in the README and existing issues before opening a new request. For open-ended ideas, Discussions may be a better fit.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case, not just the solution. Who benefits and how?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work? API sketches, CLI flags or example output are welcome.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Schema / output shape
        - Parsing quality (Spanish)
        - Parsing quality (English / other)
        - Providers / models
        - Input formats (PDF, DOCX, OCR)
        - CLI
        - Documentation
        - Other

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why they are not enough.

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this.
