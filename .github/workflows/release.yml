name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance (Sigstore attestation)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish to npm and GitHub Releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          # Writes an .npmrc that reads NODE_AUTH_TOKEN at publish time.
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test CLI
        run: node dist/cli.js --version

      # NPM_TOKEN must be a granular access token with publish rights (and
      # "bypass 2FA") for the "cvparse" package, stored as a repository secret.
      #
      # Once the package exists on npm you can switch to npm Trusted Publishing
      # (OIDC) and drop the token entirely: add this repo + this workflow file
      # as a trusted publisher in the package settings on npmjs.com, then delete
      # the NPM_TOKEN secret and remove the `env` block below. `id-token: write`
      # is already granted above, and npm >= 11.5.1 (bundled with current
      # Node 22 / 24 releases) authenticates via OIDC and generates provenance
      # on its own.
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Tags like v0.1.0-beta.1 are marked as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
